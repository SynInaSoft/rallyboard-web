<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RallyBoard 작전</title>
<meta name="description" content="RallyBoard로 공유된 배구 작전. 앱에서 가져와 내 선수로 움직여 보세요.">
<meta name="theme-color" content="#0F3B3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
  :root{--bg:#0F3B3E;--bg2:#0B2E31;--panel:#12484C;--border:#215B5E;--court:#D96F35;--line:#F6F1E7;--accent:#E8793E;--onacc:#2A1608;--txt:#F6F1E7;--sub:rgba(246,241,231,.62);--navy:#173F6B;--umber:#8C3B1E;--yel:#FCD34D}
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;background:radial-gradient(120% 60% at 50% -10%,#15505A 0%,var(--bg) 55%,var(--bg2) 100%);color:var(--txt);font-family:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:480px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:10px;padding:2px 2px 14px}
  header .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;box-shadow:0 4px 14px rgba(232,121,62,.35)}
  header b{font-size:17px;letter-spacing:.3px}
  header small{color:var(--sub);font-size:12px;margin-left:auto}
  .eyebrow{color:var(--accent);font:600 12px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 8px}
  h1{font-size:24px;line-height:1.25;margin:0 0 10px;word-break:keep-all;letter-spacing:-.01em}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .chip{font:500 12px 'IBM Plex Mono',monospace;color:var(--txt);background:rgba(246,241,231,.08);border:1px solid rgba(246,241,231,.12);border-radius:999px;padding:5px 10px}
  .card{background:linear-gradient(180deg,rgba(246,241,231,.05),rgba(246,241,231,.02));border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .court-wrap{position:relative;border-radius:14px;overflow:hidden;background:var(--bg2)}
  canvas{width:100%;height:auto;display:block}
  .controls{display:flex;align-items:center;gap:10px;margin-top:12px}
  .play{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--onacc);font-size:16px;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(232,121,62,.35);flex:none}
  .play:disabled{opacity:.4;box-shadow:none}
  .bar{flex:1;height:6px;border-radius:999px;background:rgba(246,241,231,.12);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--yel);border-radius:999px;transition:width .08s linear}
  .frame{font:500 12px 'IBM Plex Mono',monospace;color:var(--sub);min-width:44px;text-align:right}
  .cta{width:100%;border:0;border-radius:14px;padding:16px 18px;font:700 16px 'IBM Plex Sans KR',sans-serif;background:var(--accent);color:var(--onacc);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px rgba(232,121,62,.32);transition:transform .08s ease}
  .cta:active{transform:scale(.985)}
  .cta.ok{background:#2FA36B;color:#0A2A1A}
  .steps{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
  .steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-size:14px;line-height:1.55;color:rgba(246,241,231,.86)}
  .steps li span{width:26px;height:26px;border-radius:50%;background:rgba(246,241,231,.1);border:1px solid var(--border);display:grid;place-items:center;font:700 12px 'IBM Plex Mono',monospace;color:var(--txt)}
  .steps b{color:var(--txt)}
  .note{margin-top:12px;color:var(--sub);font-size:12.5px;line-height:1.5}
  details{margin-top:10px}
  summary{cursor:pointer;color:var(--sub);font-size:12.5px;list-style:none;display:inline-flex;align-items:center;gap:6px}
  summary::-webkit-details-marker{display:none}
  .code{font:11.5px/1.5 'IBM Plex Mono',monospace;color:var(--sub);word-break:break-all;margin-top:8px;padding:10px;border-radius:10px;background:rgba(0,0,0,.25);max-height:120px;overflow:auto;user-select:all}
  .store{display:flex;align-items:center;gap:14px}
  .store p{margin:0 0 8px;font-size:14px;line-height:1.5;color:rgba(246,241,231,.86)}
  .store .badge{display:inline-flex;align-items:center;gap:8px;background:#000;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 14px;text-decoration:none;font:600 14px 'IBM Plex Sans KR',sans-serif}
  .store .badge small{display:block;font:500 10px 'IBM Plex Sans KR',sans-serif;color:#bbb;line-height:1}
  footer{color:rgba(246,241,231,.4);font-size:12px;text-align:center;margin-top:18px}
  .err{border-color:#8a3a3a;background:rgba(138,58,58,.18)}
  .err p{margin:0;font-size:14px;line-height:1.55}
  .fade{animation:fade .5s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}.cta{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="fade">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A1608" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3c2.5 3 2.5 15 0 18M3 12c3-2.5 15-2.5 18 0M5.5 5.5c4 1 9.5 6.5 13 13"/></svg></div>
    <b>RallyBoard</b>
    <small id="sub">배구 작전판 · 로테이션 보드</small>
  </header>

  <div class="eyebrow fade" id="eyebrow">공유된 작전</div>
  <h1 class="fade" id="title">작전 미리보기</h1>
  <div class="chips fade" id="chips"></div>

  <section class="card fade" id="preview">
    <div class="court-wrap"><canvas id="cv" width="440" height="800"></canvas></div>
    <div class="controls">
      <button class="play" id="play" aria-label="play">▶</button>
      <div class="bar"><i id="prog"></i></div>
      <div class="frame" id="frame"></div>
    </div>
  </section>

  <section class="card fade">
    <button class="cta" id="copy"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span id="copyT">코드 복사</span></button>
    <ol class="steps" id="steps"></ol>
    <p class="note" id="note"></p>
    <details><summary id="sumT">코드 보기</summary><div class="code" id="code"></div></details>
  </section>

  <section class="card fade store">
    <div>
      <p id="get">아직 RallyBoard가 없다면 App Store에서 받으세요. 작전판·로테이션·경기 모드, 13개 언어.</p>
      <a class="badge" id="store" href="https://apps.apple.com/app/id6797665874" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8s2 .8 3.4.8c1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9-.1 0-2.7-1-2.7-4.1zM13.9 5c.7-.8 1.2-2 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"/></svg><span><small id="storeS">Download on the</small><span id="storeT">App Store</span></span></a>
    </div>
  </section>

  <footer class="fade">RallyBoard · synina</footer>
</div>

<script>
(function () {
  var ko = (navigator.language || '').toLowerCase().indexOf('ko') === 0;
  var S = ko ? {
    sub: '배구 작전판 · 로테이션 보드', eyebrow: '공유된 작전', copy: '코드 복사', copied: '복사됨 · 이제 앱에서 가져오기', sum: '코드 보기',
    steps: ['위 <b>코드 복사</b>를 누릅니다.', 'RallyBoard 앱 → 메뉴(≡) → <b>작전 가져오기</b>에 붙여넣습니다.', '<b>선수 입히기</b>로 내 선수의 이름과 번호를 입힙니다.'],
    note: '선수 이름은 들어 있지 않습니다. 번호·포지션·움직임만 공유됩니다.',
    get: '아직 RallyBoard가 없다면 App Store에서 받으세요. 작전판·로테이션·경기 모드, 13개 언어.', storeS: '다운로드', storeT: 'App Store',
    bad: '작전 코드를 읽을 수 없습니다. 링크가 잘렸을 수 있어요. 보낸 사람에게 메시지 전체를 다시 받아 붙여넣어 주세요.', none: '이 페이지는 RallyBoard 앱에서 공유한 작전 링크로 열립니다.',
    untitled: '제목 없는 작전', players: function (n) { return '선수 ' + n + '명'; }, frames: function (n) { return '동작 ' + n; }, still: '정지 대형', arrows: function (n) { return '선 ' + n; }
  } : {
    sub: 'Volleyball tactics & rotation board', eyebrow: 'Shared play', copy: 'Copy code', copied: 'Copied · now import in the app', sum: 'Show code',
    steps: ['Tap <b>Copy code</b> above.', 'RallyBoard app → Menu (≡) → <b>Import play</b>, then paste.', 'Use <b>Cast players</b> to put your players\' names and numbers on it.'],
    note: 'No player names are included. Only numbers, positions and movements are shared.',
    get: 'Don\'t have RallyBoard yet? Get it on the App Store. Tactics, rotation and match modes, 13 languages.', storeS: 'Download on the', storeT: 'App Store',
    bad: 'Couldn\'t read the play code. The link may have been cut off. Ask the sender for the whole message and paste it again.', none: 'This page opens play links shared from the RallyBoard app.',
    untitled: 'Untitled play', players: function (n) { return n + ' players'; }, frames: function (n) { return n + ' moves'; }, still: 'Static formation', arrows: function (n) { return n + ' lines'; }
  };
  document.documentElement.lang = ko ? 'ko' : 'en';
  var $ = function (id) { return document.getElementById(id); };
  $('sub').textContent = S.sub; $('eyebrow').textContent = S.eyebrow; $('copyT').textContent = S.copy; $('sumT').textContent = S.sum; $('note').textContent = S.note; $('get').textContent = S.get; $('storeS').textContent = S.storeS; $('storeT').textContent = S.storeT;
  $('steps').innerHTML = S.steps.map(function (s, i) { return '<li><span>' + (i + 1) + '</span><div>' + s + '</div></li>'; }).join('');

  // ── 코드 해석 (앱의 encodePlay와 대칭: RB1. + base64url(deflate(JSON))) ──
  var m = (location.hash || '').match(/RB1\.([A-Za-z0-9_-]{8,})/);
  var code = m ? 'RB1.' + m[1] : '';
  function b64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  var play = null;
  try { if (m && window.pako) { var o = JSON.parse(pako.inflate(b64u(m[1]), { to: 'string' })); if (o && o.v === 1 && o.b && Array.isArray(o.b.tokens)) play = o; } } catch (e) { play = null; }
  if (!play) {
    $('title').textContent = S.untitled; $('chips').style.display = 'none';
    $('preview').className = 'card err'; $('preview').innerHTML = '<p>' + (m ? S.bad : S.none) + '</p>';
    $('copy').disabled = true; $('copy').style.opacity = .4; $('code').textContent = '';
    return;
  }
  var b = play.b, title = (play.t || '').trim() || S.untitled;
  document.title = title + ' · RallyBoard';
  $('title').textContent = title; $('code').textContent = code;
  var frames = (b.frames || []).filter(function (f) { return f && f.positions; });
  var nP = b.tokens.filter(function (t) { return t.kind === 'player'; }).length, nD = (b.drawings || []).length;
  var chips = [S.players(nP), frames.length ? S.frames(frames.length) : S.still]; if (nD) chips.push(S.arrows(nD));
  $('chips').innerHTML = chips.map(function (c) { return '<span class="chip">' + c + '</span>'; }).join('');

  // ── 코트 (앱 좌표계: M=40, CW=360, CH=720, 네트 y=400, 공격선 ±120) ──
  var cv = $('cv'), ctx = cv.getContext('2d');
  var X0 = 40, X1 = 400, Y0 = 40, Y1 = 760, NET = 400, W = 440, H = 800;
  var flipped = !!b.flipped;
  function P(x, y) { return flipped ? [X0 + X1 - x, Y0 + Y1 - y] : [x, y]; }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function court() {
    ctx.fillStyle = '#0B2E31'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6; ctx.fillStyle = '#D96F35'; rr(X0, Y0, 360, 720, 6); ctx.fill(); ctx.restore();
    ctx.strokeStyle = '#F6F1E7'; ctx.lineWidth = 3; rr(X0, Y0, 360, 720, 6); ctx.stroke();
    ctx.lineWidth = 2; ctx.globalAlpha = .9; [NET - 120, NET + 120].forEach(function (y) { ctx.beginPath(); ctx.moveTo(X0, y); ctx.lineTo(X1, y); ctx.stroke(); }); ctx.globalAlpha = 1;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(X0 - 14, NET); ctx.lineTo(X1 + 14, NET); ctx.stroke(); ctx.restore();
  }
  function arrowHead(a, z, color, w) { var ang = Math.atan2(z[1] - a[1], z[0] - a[0]), L = 10 + w * 1.5; ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(z[0], z[1]); ctx.lineTo(z[0] - L * Math.cos(ang - .45), z[1] - L * Math.sin(ang - .45)); ctx.lineTo(z[0] - L * Math.cos(ang + .45), z[1] - L * Math.sin(ang + .45)); ctx.closePath(); ctx.fill(); }
  function drawLines() {
    (b.drawings || []).forEach(function (d) {
      var pts = (d.points || []).map(function (p) { return Array.isArray(p) ? P(p[0], p[1]) : P(p.x, p.y); }); if (pts.length < 2) return;
      if (d.straight) pts = [pts[0], pts[pts.length - 1]];
      var color = d.color || '#F6F1E7', w = d.width || 3;
      ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.setLineDash(d.dashed ? [9, 7] : []);
      ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke(); ctx.setLineDash([]);
      if (!d.type || /arrow|line/.test(d.type) && d.type !== 'line') arrowHead(pts[pts.length - 2], pts[pts.length - 1], color, w);
    });
  }
  function label(t, x, y, r, fill) {
    ctx.fillStyle = fill; ctx.font = '700 ' + Math.round(r * .95) + 'px "IBM Plex Mono", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(t.label || ''), x, y + 1);
    if (t.role) { var tw = ctx.measureText(t.role).width; ctx.font = '700 9px "IBM Plex Mono", monospace'; tw = ctx.measureText(t.role).width + 8; ctx.fillStyle = '#F6F1E7'; rr(x - tw / 2, y - r - 14, tw, 13, 6); ctx.fill(); ctx.fillStyle = '#173F6B'; ctx.fillText(t.role, x, y - r - 7); }
  }
  function token(t, x, y) {
    var pp = P(x, y), r = 17 * (t.size || 1), cx = pp[0], cy = pp[1];
    if (t.kind === 'player') {
      var col = t.color || (t.team === 'B' ? '#8C3B1E' : '#173F6B');
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3; ctx.fillStyle = col;
      if (t.shape === 'jersey') { ctx.beginPath(); ctx.moveTo(cx - r, cy + r * .9); ctx.lineTo(cx - r, cy - r * .35); ctx.arcTo(cx - r, cy - r, cx - r * .5, cy - r, r * .6); ctx.lineTo(cx + r * .5, cy - r); ctx.arcTo(cx + r, cy - r, cx + r, cy - r * .35, r * .6); ctx.lineTo(cx + r, cy + r * .9); ctx.closePath(); ctx.fill(); ctx.restore(); ctx.strokeStyle = '#F6F1E7'; ctx.lineWidth = 2; ctx.stroke(); }
      else { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.restore(); ctx.strokeStyle = '#F6F1E7'; ctx.lineWidth = 2; ctx.stroke(); }
      label(t, cx, cy, r, '#F6F1E7');
    } else if (t.kind === 'ball') {
      var br = 9 * (t.size || 1); ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2; ctx.fillStyle = '#F6F1E7'; ctx.beginPath(); ctx.arc(cx, cy, br, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.strokeStyle = '#173F6B'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, br, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#E8793E'; ctx.beginPath(); ctx.arc(cx - br * .6, cy, br * .95, -.9, .9); ctx.stroke(); ctx.beginPath(); ctx.arc(cx + br * .6, cy, br * .95, Math.PI - .9, Math.PI + .9); ctx.stroke();
    } else if (t.kind === 'cone') { ctx.fillStyle = t.color || '#FCD34D'; ctx.beginPath(); ctx.moveTo(cx, cy - 10); ctx.lineTo(cx + 9, cy + 8); ctx.lineTo(cx - 9, cy + 8); ctx.closePath(); ctx.fill(); }
    else { ctx.fillStyle = t.color || '#FCD34D'; ctx.globalAlpha = .85; rr(cx - 14, cy - 8, 28, 16, 4); ctx.fill(); ctx.globalAlpha = 1; }
  }
  function render(pos) { court(); drawLines(); b.tokens.forEach(function (t) { var p = pos && pos[t.id] ? pos[t.id] : t; token(t, p.x, p.y); }); }

  // ── 애니메이션 ──
  var start = {}; b.tokens.forEach(function (t) { start[t.id] = { x: t.x, y: t.y }; });
  var seq = [start].concat(frames.map(function (f) { return f.positions; }));
  var segMs = 1000 * (typeof b.term === 'number' ? b.term : 1), hold = 900, playing = false, raf = 0, t0 = 0;
  var total = (seq.length - 1) * segMs + hold;
  function lerp(a, c, p) { var o = {}; b.tokens.forEach(function (t) { var s = a[t.id] || start[t.id], e = c[t.id] || s; o[t.id] = { x: s.x + (e.x - s.x) * p, y: s.y + (e.y - s.y) * p }; }); return o; }
  function ease(p) { return p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
  function tick(now) {
    if (!playing) return; var tt = (now - t0) % total, i = Math.min(seq.length - 2, Math.floor(tt / segMs)), p = Math.min(1, (tt - i * segMs) / segMs);
    render(lerp(seq[i], seq[i + 1], ease(p))); $('prog').style.width = Math.min(100, tt / (total - hold) * 100) + '%'; $('frame').textContent = Math.min(i + 1, seq.length - 1) + ' / ' + (seq.length - 1);
    raf = requestAnimationFrame(tick);
  }
  $('play').onclick = function () {
    playing = !playing; $('play').textContent = playing ? '❚❚' : '▶';
    if (playing) { t0 = performance.now(); raf = requestAnimationFrame(tick); } else { cancelAnimationFrame(raf); render(null); $('prog').style.width = '0%'; $('frame').textContent = '0 / ' + (seq.length - 1); }
  };
  if (seq.length < 2) { $('play').disabled = true; $('frame').textContent = ''; } else $('frame').textContent = '0 / ' + (seq.length - 1);
  render(null);

  // ── 코드 복사 ──
  $('copy').onclick = function () {
    var done = function () { $('copy').classList.add('ok'); $('copyT').textContent = S.copied; setTimeout(function () { $('copy').classList.remove('ok'); $('copyT').textContent = S.copy; }, 2200); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, function () { window.prompt('', code); });
    else window.prompt('', code);
  };
})();
</script>
</body>
</html>
