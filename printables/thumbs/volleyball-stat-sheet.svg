/><line x1="524" y1="168" x2="524" y2="808" stroke="#999" stroke-width="0.6"/><line x1="568" y1="168" x2="568" y2="808" stroke="#111" stroke-width="0.9"/><line x1="608" y1="168" x2="608" y2="808" stroke="#999" stroke-width="0.6"/><line x1="648" y1="168" x2="648" y2="808" stroke="#999" stroke-width="0.6"/><line x1="708" y1="168" x2="708" y2="808" stroke="#111" stroke-width="0.9"/><line x1="742" y1="168" x2="742" y2="808" stroke="#999" stroke-width="0.6"/><line x1="796" y1="168" x2="796" y2="808" stroke="#111" stroke-width="0.9"/><text x="46" y="834" font-size="9" font-weight="bold" text-anchor="start" fill="#111">TEAM TOTAL</text><rect x="40" y="818" width="756" height="26" rx="0" stroke="#111" stroke-width="1" fill="none"/><text x="40" y="868" font-size="8.5" font-weight="normal" text-anchor="start" fill="#333">Pass rating: 3 = perfect, setter has every option · 2 = good, setter has some options · 1 = poor, one option · 0 = aced or no play</text><text x="40" y="884" font-size="8.5" font-weight="normal" text-anchor="start" fill="#333">Pass average = (3 × count of 3s + 2 × count of 2s + 1 × count of 1s) ÷ total passes</text><text x="40" y="900" font-size="8.5" font-weight="normal" text-anchor="start" fill="#333">Hitting percentage = (kills − attack errors) ÷ total attacks · ATT = every attack attempt, including kills and errors</text><line x1="40" y1="1004" x2="810" y2="1004" stroke="#bbb" stroke-width="0.6"/><text x="40" y="1024" font-size="8.5" font-weight="bold" text-anchor="start" fill="#222">Same stats on a phone: the RallyStat app records serve, pass and attack by player, and points by rotation.</text><text x="40" y="1040" font-size="8" font-weight="normal" text-anchor="start" fill="#555">Free printable from RallyBoard, a volleyball rotation and tactics board app. Scan the code for the app and more sheets.</text><text x="40" y="1053" font-size="8" font-weight="normal" text-anchor="start" fill="#555">syninasoft.github.io/rallyboard-web/volleyball-rotation-sheets.